openapi: 3.0.0
info:
  title: Shindex API
  version: 1.0.0
  description: API endpoints for Shindex, a sleek unified frontend dashboard for media infrastructure.
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /api/downloads/track:
    post:
      summary: Track a download
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                itemTitle:
                  type: string
                downloadType:
                  type: string
                size:
                  type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
  /api/downloads/top:
    get:
      summary: Get top downloads
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /api/downloads/clear:
    post:
      summary: Clear download history
      responses:
        '200':
          description: Success
  /api/watchlist:
    get:
      summary: Get user watchlist
      responses:
        '200':
          description: Success
  /api/watchlist/toggle:
    post:
      summary: Toggle watchlist item
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                item:
                  type: object
      responses:
        '200':
          description: Success
  /api/watched:
    get:
      summary: Get user watched list
      responses:
        '200':
          description: Success
  /api/watched/toggle:
    post:
      summary: Toggle watched item
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                item:
                  type: object
      responses:
        '200':
          description: Success
  /api/watched/bulk-toggle:
    post:
      summary: Bulk toggle watched items
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Success
  /api/recommendations:
    get:
      summary: Get personalized recommendations
      responses:
        '200':
          description: Success
  /api/config:
    get:
      summary: Get app config
      responses:
        '200':
          description: Success
    post:
      summary: Save app config
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Success
  /api/auth/login:
    post:
      summary: Authenticate user
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Success
  /api/auth/guest_login:
    post:
      summary: Guest login
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
      responses:
        '200':
          description: Success
  /api/auth/me:
    get:
      summary: Get current user
      responses:
        '200':
          description: Success
  /api/meta/search:
    get:
      summary: Search metadata
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Success
  /api/jellyfin/recently-added:
    get:
      summary: Get Jellyfin recently added
      responses:
        '200':
          description: Success
  /api/chat:
    post:
      summary: Chat with AI assistant
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
      responses:
        '200':
          description: Success

openapi: 3.0.3
info:
  title: 'Shindex Media Server API'
  version: 1.0.0
  description: 'Comprehensive RESTful API specification for Shindex, a unified media server and dashboard. This API allows external client applications (mobile, TV, web, desktop) to authenticate, stream media files, browse library directory structures, search and match rich TMDB metadata, manage personal watchlists and watch history, curate custom playlists/collections, fetch and stream subtitles, track downloads, and administer the server.'
servers:
  -
    url: /
    description: 'Current Shindex Server'
tags:
  -
    name: Auth
    description: 'Authentication, guest sessions, and token identity'
  -
    name: FileSystem
    description: 'Directory browsing, file metadata, streaming links, and file management via OpenList'
  -
    name: Metadata
    description: 'TMDB movie/TV metadata, posters, backdrops, logos, trailers, and seasons'
  -
    name: Watchlist
    description: 'User personal watchlist management'
  -
    name: Watched
    description: 'Watch history, playback progress, and watched toggling'
  -
    name: Recommendations
    description: 'Personalized media recommendations engine'
  -
    name: Subtitles
    description: 'Subtitle search, WebVTT conversion, daily quota tracking, and downloads'
  -
    name: 'Media & Streaming'
    description: 'Folder archive ZIP downloads, WebDAV status, and image proxy'
  -
    name: 'User Collections'
    description: 'Community lists, playlists, and user collections'
  -
    name: Downloads
    description: 'Download tracking analytics and top downloaded media'
  -
    name: Jellyfin
    description: 'Recently added sync and Jellyfin path overrides'
  -
    name: 'AI & Chat'
    description: 'AI-powered media assistant and recommendations chatbot'
  -
    name: Configuration
    description: 'Server system configuration, announcements, and path mappings'
  -
    name: Admin
    description: 'User expirations, lockout resets, active sessions, diagnostics, and audit logs'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: 'Token / JWT'
      description: 'User or Admin authentication token received from /api/auth/login or /api/auth/guest_login. May be passed as `Bearer <token>` or plain `<token>` in the `Authorization` header.'
    userHeader:
      type: apiKey
      in: header
      name: x-user
      description: 'Username string used by personalization endpoints (watchlist, watched progress, user collections).'
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Unauthorized
        code:
          type: integer
          example: 401
        message:
          type: string
          example: 'Invalid credentials or expired session'
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Operation completed successfully'
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
          example: password123
    LoginResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          type: object
          properties:
            id:
              type: integer
              example: 1
            username:
              type: string
              example: admin
            role:
              type: integer
              example: 2
              description: 'User role (2 = Admin, 0 = Standard/Guest)'
            base_path:
              type: string
              example: /home
            permission:
              type: integer
              example: 0
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    GuestLoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          example: guest_4a9f3b18c...
    AuthMeResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          type: object
          properties:
            id:
              type: integer
              example: 1
            username:
              type: string
              example: admin
            role:
              type: integer
              example: 2
            base_path:
              type: string
              example: /home
            permission:
              type: integer
              example: 0
            disabled:
              type: boolean
              example: false
    FsItem:
      type: object
      properties:
        name:
          type: string
          example: Dune.Part.Two.2024.1080p.mkv
        size:
          type: integer
          example: 5242880000
          description: 'File size in bytes'
        is_dir:
          type: boolean
          example: false
        modified:
          type: string
          example: '2024-03-01T12:00:00Z'
        created:
          type: string
          example: '2024-03-01T12:00:00Z'
        sign:
          type: string
          example: abc123sign
        thumb:
          type: string
          example: ""
        type:
          type: integer
          example: 2
          description: '1: folder, 2: video, 3: audio, etc.'
        raw_url:
          type: string
          example: 'https://cdn.example.com/stream/dune2.mkv'
    FsListRequest:
      type: object
      properties:
        reqPath:
          type: string
          example: /home/MOVIES
          description: 'Folder path to list (defaults to server basePath)'
        refresh:
          type: boolean
          example: false
          description: 'Force refresh cache from storage provider'
    FsListResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/FsItem'
            total:
              type: integer
              example: 45
            readme:
              type: string
              example: ""
            header:
              type: string
              example: ""
    FsGetRequest:
      type: object
      required:
        - reqPath
      properties:
        reqPath:
          type: string
          example: /home/MOVIES/Dune.2024.mkv
    FsGetResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          type: object
          properties:
            name:
              type: string
              example: Dune.2024.mkv
            size:
              type: integer
              example: 5242880000
            is_dir:
              type: boolean
              example: false
            modified:
              type: string
              example: '2024-03-01T12:00:00Z'
            raw_url:
              type: string
              example: 'https://cdn.example.com/stream/dune2.mkv'
            provider:
              type: string
              example: 'OpenList / AList'
    FsSearchRequest:
      type: object
      required:
        - keywords
      properties:
        keywords:
          type: string
          example: Interstellar
          description: 'Search term, IMDb ID (tt...), or TMDB ID'
        parent:
          type: string
          example: /home
          description: 'Parent path scope for search'
    FsSearchResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/FsItem'
            total:
              type: integer
              example: 1
    FsRemoveRequest:
      type: object
      required:
        - names
        - dir
      properties:
        names:
          type: array
          items:
            type: string
          example:
            - old_movie.mkv
        dir:
          type: string
          example: /home/MOVIES
    TmdbItem:
      type: object
      properties:
        id:
          type: integer
          example: 693134
        title:
          type: string
          example: 'Dune: Part Two'
        name:
          type: string
          example: 'Dune: Part Two'
        overview:
          type: string
          example: 'Follow the mythic journey of Paul Atreides...'
        poster_path:
          type: string
          example: /czembW0Rk1Ke7lCJGhkAiBhQ9la.jpg
        backdrop_path:
          type: string
          example: /xOMo8BRK7PfcJv9JCnx7s520b22.jpg
        release_date:
          type: string
          example: '2024-02-27'
        first_air_date:
          type: string
          example: ""
        vote_average:
          type: number
          example: 8.2
        vote_count:
          type: integer
          example: 4500
        genre_ids:
          type: array
          items:
            type: integer
          example:
            - 878
            - 12
        genres:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
        media_type:
          type: string
          example: movie
        runtime:
          type: integer
          example: 166
        logo_path:
          type: string
          example: /path_to_logo.png
        custom_logo:
          type: string
          example: 'https://example.com/logo.png'
    TmdbEpisode:
      type: object
      properties:
        id:
          type: integer
          example: 12345
        name:
          type: string
          example: 'Chapter One'
        overview:
          type: string
          example: 'Episode summary...'
        air_date:
          type: string
          example: '2023-01-15'
        episode_number:
          type: integer
          example: 1
        season_number:
          type: integer
          example: 1
        still_path:
          type: string
          example: /still.jpg
        vote_average:
          type: number
          example: 8.5
    TmdbSeason:
      type: object
      properties:
        id:
          type: integer
          example: 789
        name:
          type: string
          example: 'Season 1'
        season_number:
          type: integer
          example: 1
        overview:
          type: string
          example: 'Season overview'
        poster_path:
          type: string
          example: /season1.jpg
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/TmdbEpisode'
    WatchlistItem:
      type: object
      properties:
        name:
          type: string
          example: 'Dune: Part Two'
        path:
          type: string
          example: MOVIES/Dune.Part.Two.2024
        parentPath:
          type: string
          example: MOVIES
        category:
          type: string
          example: MOVIES
        addedAt:
          type: integer
          example: 1709294400000
        tmdbData:
          $ref: '#/components/schemas/TmdbItem'
    WatchlistToggleRequest:
      type: object
      properties:
        item:
          type: object
        category:
          type: string
          example: MOVIES
        parentPath:
          type: string
          example: MOVIES
        action:
          type: string
          enum:
            - add
            - remove
            - toggle
          example: toggle
        watchlisted:
          type: boolean
          example: true
        tmdbData:
          $ref: '#/components/schemas/TmdbItem'
    WatchedItem:
      type: object
      properties:
        name:
          type: string
          example: S01E01.mkv
        parentPath:
          type: string
          example: SERIES/Breaking.Bad/Season.1
        timestamp:
          type: integer
          example: 1709294400000
        showName:
          type: string
          example: 'Breaking Bad'
        showPath:
          type: string
          example: SERIES/Breaking.Bad
        tmdbId:
          type: integer
          example: 1396
        tmdbData:
          $ref: '#/components/schemas/TmdbItem'
    WatchedToggleRequest:
      type: object
      required:
        - name
        - parentPath
      properties:
        name:
          type: string
          example: S01E01.mkv
        parentPath:
          type: string
          example: SERIES/Breaking.Bad/Season.1
        action:
          type: string
          enum:
            - record
            - toggle
          example: record
        showName:
          type: string
          example: 'Breaking Bad'
        showPath:
          type: string
          example: SERIES/Breaking.Bad
        tmdbId:
          type: integer
          example: 1396
        tmdbData:
          $ref: '#/components/schemas/TmdbItem'
    WatchedBulkToggleRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - name
              - parentPath
            properties:
              name:
                type: string
                example: S01E01.mkv
              parentPath:
                type: string
                example: SERIES/Breaking.Bad/Season.1
              watched:
                type: boolean
                example: true
              showName:
                type: string
                example: 'Breaking Bad'
              showPath:
                type: string
                example: SERIES/Breaking.Bad
              tmdbId:
                type: integer
                example: 1396
              tmdbData:
                $ref: '#/components/schemas/TmdbItem'
    UserCollection:
      type: object
      properties:
        id:
          type: string
          example: col_1711200000_abcde
        name:
          type: string
          example: 'Sci-Fi Masterpieces'
        description:
          type: string
          example: 'Best sci-fi movies of all time'
        authorName:
          type: string
          example: Cinephile
        createdBy:
          type: string
          example: admin
        isPublic:
          type: boolean
          example: true
        categoryTag:
          type: string
          example: Lists
        items:
          type: array
          items:
            type: object
        upvotes:
          type: array
          items:
            type: string
          example:
            - admin
            - john
        createdAt:
          type: integer
          example: 1711200000000
        updatedAt:
          type: integer
          example: 1711200000000
    CreateUserCollectionRequest:
      type: object
      required:
        - name
        - authorName
      properties:
        name:
          type: string
          example: 'Favorite Anime'
        description:
          type: string
          example: 'Must-watch anime series'
        authorName:
          type: string
          example: OtakuUser
        isPublic:
          type: boolean
          example: true
        categoryTag:
          type: string
          example: Anime
        items:
          type: array
          items:
            type: object
    UpdateUserCollectionRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        authorName:
          type: string
        isPublic:
          type: boolean
        categoryTag:
          type: string
        items:
          type: array
          items:
            type: object
    SubtitleQuota:
      type: object
      properties:
        username:
          type: string
          example: john
        isAdmin:
          type: boolean
          example: false
        limit:
          oneOf:
            -
              type: integer
            -
              type: string
          example: 20
        used:
          type: integer
          example: 3
        remaining:
          oneOf:
            -
              type: integer
            -
              type: string
          example: 17
    DownloadTrackRequest:
      type: object
      properties:
        title:
          type: string
          example: 'Inception (2010)'
        fileName:
          type: string
          example: Inception.2010.1080p.mkv
        category:
          type: string
          example: MOVIES
        isShow:
          type: boolean
          example: false
        count:
          type: integer
          example: 1
    DownloadItem:
      type: object
      properties:
        title:
          type: string
          example: Inception
        category:
          type: string
          example: MOVIES
        count:
          type: integer
          example: 42
        lastDownloaded:
          type: integer
          example: 1709294400000
        isShow:
          type: boolean
          example: false
    AppConfig:
      type: object
      properties:
        openlistUrl:
          type: string
          example: 'https://openlist.example.com'
        basePath:
          type: string
          example: /home
        inactivityTimeout:
          type: integer
          example: 30
        announcement:
          type: string
          example: 'Welcome to Shindex!'
        unreleasedTmdbIds:
          type: array
          items:
            type: integer
          example:
            - 12345
        digitalReleasePaths:
          type: object
          additionalProperties:
            type: string
          example:
            '693134': /home/MOVIES/Dune.Part.Two.2024
    ChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: 'Recommend me a mind-bending sci-fi movie'
        history:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum:
                  - user
                  - model
                example: user
              parts:
                type: array
                items:
                  type: object
                  properties: {text: {type: string, example: Hi}}
    ChatResponse:
      type: object
      properties:
        reply:
          type: string
          example: 'I highly recommend Inception and Interstellar...'
    ScanStatus:
      type: object
      properties:
        isRunning:
          type: boolean
          example: false
        message:
          type: string
          example: Idle
        count:
          type: integer
          example: 120
        total:
          type: integer
          example: 350
        failedItems:
          type: array
          items:
            type: object
    UserExpirationItem:
      type: object
      properties:
        userId:
          type: integer
          example: 12
        expirationDate:
          type: string
          example: '2026-12-31T23:59:59.000Z'
    UserLockoutItem:
      type: object
      properties:
        failedAttempts:
          type: integer
          example: 3
        locked:
          type: boolean
          example: false
        lastAttempt:
          type: string
          example: '2024-03-01T12:00:00Z'
    AdminSessionItem:
      type: object
      properties:
        username:
          type: string
          example: john
        token:
          type: string
          example: token123...
        loginTime:
          type: integer
          example: 1709294400000
        ip:
          type: string
          example: 192.168.1.1
        userAgent:
          type: string
          example: Mozilla/5.0...
    AdminLogItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        action:
          type: string
          example: 'User Login'
        username:
          type: string
          example: john
        details:
          type: string
          example: 'Logged in from 192.168.1.1'
        timestamp:
          type: string
          example: '2024-03-01T12:00:00Z'
paths:
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: 'User Login'
      description: 'Authenticate an existing user or administrator account. Checks account lockout and expiration status. Returns auth token and user profile.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 'Successfully authenticated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 'Missing username or password'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Account locked or expired'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/guest_login:
    post:
      tags:
        - Auth
      summary: 'Guest Login'
      description: 'Generate a 24-hour temporary guest session token. Restricted to once per 24 hours per IP address.'
      responses:
        '200':
          description: 'Guest token issued'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestLoginResponse'
        '429':
          description: 'Guest rate limit reached (1 login per 24 hours)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: 'Current User Identity'
      description: 'Verify the active token and retrieve user profile details, roles, and storage permissions.'
      security:
        -
          bearerAuth: []
      responses:
        '200':
          description: 'User profile retrieved'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: 'Invalid or expired session token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/me:
    get:
      tags:
        - Auth
      summary: 'Current User Identity (Alias)'
      description: 'Direct alias to `/api/auth/me`.'
      security:
        -
          bearerAuth: []
      responses:
        '200':
          description: 'User profile retrieved'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
  /api/fs/list:
    post:
      tags:
        - FileSystem
      summary: 'List Directory Contents'
      description: 'Retrieve media files and subdirectories for a specified path. Results are cached with stale-while-revalidate. Supports force refresh.'
      security:
        -
          bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FsListRequest'
      responses:
        '200':
          description: 'Directory listing'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FsListResponse'
        '403':
          description: 'Forbidden access to path outside base path'
  /api/fs/get:
    post:
      tags:
        - FileSystem
      summary: 'Get File Details & Stream URL'
      description: 'Retrieve direct streaming URL, size, mime type, and metadata for a specific media file.'
      security:
        -
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FsGetRequest'
      responses:
        '200':
          description: 'File metadata and direct streaming URL'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FsGetResponse'
        '400':
          description: 'Missing path'
        '403':
          description: 'Forbidden access'
  /api/fs/search:
    post:
      tags:
        - FileSystem
      summary: 'Search Filesystem'
      description: 'Search files and folders by keywords. Supports IMDb ID (tt...) and TMDB ID prefix resolution.'
      security:
        -
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FsSearchRequest'
      responses:
        '200':
          description: 'Search results matching keywords'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FsSearchResponse'
  /api/fs/remove:
    post:
      tags:
        - FileSystem
      summary: 'Remove Files/Folders'
      description: 'Delete files or directories from storage. Restricted to logged in users (guests forbidden).'
      security:
        -
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FsRemoveRequest'
      responses:
        '200':
          description: 'Files removed successfully'
        '403':
          description: 'Guests cannot remove files'
  /api/meta/search:
    get:
      tags:
        - Metadata
      summary: 'Search TMDB Metadata'
      description: 'Fetch matched TMDB metadata for a media title. Checks local cache, custom overrides, and fallback TMDB queries.'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: query
          in: query
          required: true
          schema:
            type: string
          description: 'Title to search for'
        -
          name: type
          in: query
          schema:
            type: string
            enum:
              - movie
              - tv
          description: 'Media category or type'
        -
          name: year
          in: query
          schema:
            type: string
          description: 'Release year'
        -
          name: tmdbId
          in: query
          schema:
            type: integer
          description: 'Explicit TMDB ID'
        -
          name: path
          in: query
          schema:
            type: string
          description: 'Library item path for override matching'
        -
          name: full
          in: query
          schema:
            type: string
          description: 'Whether to attach full credits and keywords'
      responses:
        '200':
          description: 'TMDB metadata record'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmdbItem'
  /api/meta/search_all:
    get:
      tags:
        - Metadata
      summary: 'Multi-Match TMDB Search'
      description: 'Search TMDB and return multiple candidate matches across movies and TV series (useful for fix/match modals).'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: query
          in: query
          required: true
          schema:
            type: string
        -
          name: type
          in: query
          schema:
            type: string
        -
          name: year
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 'Array of candidate TMDB matches'
          content:
            application/json:
              schema:

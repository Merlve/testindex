<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fffcf9" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>SHUTTER! - Unlimited Movies, Series & Anime</title>
    <meta name="description" content="Stream and explore unlimited movies, TV series, and anime with rich metadata, posters, and high-speed streaming." />
    <meta property="og:site_name" content="SHUTTER!" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SHUTTER! - Unlimited Movies, Series & Anime" />
    <meta property="og:description" content="Stream and explore unlimited movies, TV series, and anime with rich metadata, posters, and high-speed streaming." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=1200&h=630&fit=crop" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SHUTTER! - Unlimited Movies, Series & Anime" />
    <meta name="twitter:description" content="Stream and explore unlimited movies, TV series, and anime with rich metadata, posters, and high-speed streaming." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=1200&h=630&fit=crop" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          if (savedTheme === 'dark') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#08080a');
            document.documentElement.classList.add('dark');
          } else if (savedTheme === 'light') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fffcf9');
            document.documentElement.classList.remove('dark');
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#08080a');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Strictly prevent zoom on iOS Safari and modern mobile browsers
      document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
      });
      document.addEventListener('gesturechange', function(e) {
        e.preventDefault();
      });
      document.addEventListener('gestureend', function(e) {
        e.preventDefault();
      });
      document.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1 || (e.scale && e.scale !== 1)) {
          e.preventDefault();
        }
      }, { passive: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
